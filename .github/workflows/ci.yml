name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Opt in to Node 24 ahead of the June 2026 default flip so we don't carry
  # deprecation warnings on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          # No external deps -> no go.sum -> cache key would fail to resolve.
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        uses: securego/gosec@master
        with:
          # -fmt=sarif could go to code-scanning; for now just fail on issues.
          args: ./...
